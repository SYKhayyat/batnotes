[package]
name = "batnotes"
version = "0.1.0"
edition = "2021"

[lib]
name = "batnotes"
path = "src/lib.rs"

[[bin]]
name = "batnotes"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
