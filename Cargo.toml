[package]
name = "batnotes"
version = "0.2.0"
edition = "2021"

[lib]
name = "batnotes"
path = "src/lib.rs"

[[bin]]
name = "batnotes"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
anyhow = "1"
zbus = { version = "4", default-features = false, features = ["blocking", "async-io"] }
zvariant = "4"
zbus_names = "3"
x11-dl = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Deliberately NOT `panic = "abort"` and NOT stripped. A stripped aborting
# build turns every panic into an anonymous core dump with no message, which is
# exactly how the first crash went undiagnosed.
panic = "unwind"
debug = 1